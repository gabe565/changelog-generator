name: Test Action

on: push

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
      - uses: ./
        id: changelog
        with:
          path: test
          install-only: "true"
      - name: Binary exists
        shell: bash
        run: command -v changelog-generator
      - name: Binary runs
        shell: bash
        run: changelog-generator --version
