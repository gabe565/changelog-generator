name: Test Action

on: push

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./
        id: changelog
        with:
          path: test
          install-only: "true"
      - name: Binary exists
        shell: bash
        run: command -v changelog-generator
      - name: Binary runs
        shell: bash
        run: changelog-generator --version
